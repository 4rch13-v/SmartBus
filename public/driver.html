<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBus Driver Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        const sysPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('smartbus-theme') || (sysPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        :root {
            --font-heading: 'Sora', sans-serif;
            --font-body: 'Inter', sans-serif;
            
            --color-primary: #5b4de0; 
            --color-primary-glow: rgba(91, 77, 224, 0.35);
            --color-live: #16a34a;
            --color-live-glow: rgba(22, 163, 74, 0.35);
            --color-terminate: #e11d48;
            --color-terminate-glow: rgba(225, 29, 72, 0.35);
            --color-warning: #D97706;
            
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-elevated: #F1F5F9;
            
            --border-subtle: #E2E8F0;
            --border-card: #CBD5E1;
            --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
            
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-inv: #FFFFFF;
            
            --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 32px;
            --radius-outer: 16px; --radius-inner: 12px; --radius-btn: 14px;
            --transition: all 0.2s ease-in-out;
            --header-height: 72px;
        }

        [data-theme="dark"] {
            --color-primary: #6D5EF5;
            --color-primary-glow: rgba(109, 94, 245, 0.35);
            --color-live: #22C55E;
            --color-live-glow: rgba(34, 197, 94, 0.35);
            --color-terminate: #F43F5E;
            --color-terminate-glow: rgba(244, 63, 94, 0.35);
            --color-warning: #F59E0B;
            
            --bg-page: #0B0D14;
            --bg-card: #12151F;
            --bg-elevated: #181C29;
            
            --border-subtle: rgba(255,255,255,0.06);
            --border-card: rgba(255,255,255,0.06);
            --shadow-card: 0 4px 20px rgba(0,0,0,0.35);
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        
        * { box-sizing: border-box; }
        *:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
        
        body { 
            font-family: var(--font-body); 
            background: var(--bg-page); color: var(--text-main); 
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            line-height: 1.5;
        }

        h1, h2, h3, h4, .font-heading { font-family: var(--font-heading); margin: 0; }
        
        /* Sticky Header */
        .navbar {
            height: var(--header-height); background: var(--bg-card);
            border-bottom: 1px solid var(--border-card);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 var(--space-4); position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-card);
        }
        
        .brand { display: flex; align-items: center; gap: var(--space-2); }
        .brand i { color: var(--color-primary); width: 28px; height: 28px; }
        .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        
        .icon-btn {
            background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text-muted);
            cursor: pointer; padding: var(--space-2); border-radius: var(--radius-inner);
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .icon-btn:hover { background: var(--bg-card); color: var(--text-main); border-color: var(--text-muted); }
        .icon-btn:active { transform: scale(0.92); }

        /* Main Container */
        .container { width: 100%; max-width: 480px; margin: 0 auto; padding: var(--space-5) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
        
        /* Cards */
        .card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-outer); box-shadow: var(--shadow-card); overflow: hidden; }
        .card-header { padding: var(--space-4); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: var(--space-2); }
        .card-header h2 { font-size: 20px; font-weight: 700; }
        .card-body { padding: var(--space-4); }
        
        /* Step Indicator */
        .step-indicator { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
        .step { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); font-size: 12px; font-weight: 500; color: var(--text-muted); transition: var(--transition); }
        .step.active { color: var(--color-primary); font-weight: 600; }
        .step.completed { color: var(--text-main); font-weight: 600; }
        .step-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; transition: var(--transition); }
        .step.active .step-dot { background: var(--color-primary); color: #fff; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-glow); }
        .step.completed .step-dot { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
        .step-line { flex: 1; height: 2px; background: var(--border-subtle); margin: 0 var(--space-3); margin-bottom: 20px; transition: var(--transition); }
        .step.completed + .step-line { background: var(--color-primary); }

        .form-group { margin-bottom: var(--space-4); }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: var(--space-2); color: var(--text-muted); }
        
        .custom-select-wrapper { position: relative; width: 100%; }
        .custom-select-wrapper i.select-icon { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 20px; height: 20px; pointer-events: none; }
        .custom-select-wrapper i.select-arrow { position: absolute; right: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 20px; height: 20px; pointer-events: none; }
        
        input, select { 
            width: 100%; padding: var(--space-3); padding-left: 44px;
            background: var(--bg-elevated); color: var(--text-main);
            border: 1px solid var(--border-subtle); border-radius: var(--radius-inner);
            font-family: var(--font-body); font-size: 14px;
            transition: var(--transition); appearance: none;
        }
        input:focus, select:focus { border-color: var(--color-primary); outline: none; box-shadow: 0 0 0 3px var(--color-primary-glow); }
        input[type="password"] { padding-left: 16px; }

        /* Buttons */
        .btn { 
            width: 100%; padding: var(--space-3) var(--space-4); border-radius: var(--radius-btn); 
            font-family: var(--font-body); font-weight: 500; font-size: 15px; 
            transition: var(--transition); border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: var(--space-2);
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--color-primary); color: #fff; box-shadow: 0 4px 16px var(--color-primary-glow); }
        .btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--color-primary) 85%, white); box-shadow: 0 6px 20px var(--color-primary-glow); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        
        .btn-start { background: var(--color-live); color: #fff; box-shadow: 0 4px 16px var(--color-live-glow); }
        .btn-start:hover { background: color-mix(in srgb, var(--color-live) 85%, white); box-shadow: 0 6px 20px var(--color-live-glow); transform: translateY(-1px); }
        .btn-stop { background: var(--color-terminate); color: #fff; box-shadow: 0 4px 16px var(--color-terminate-glow); display: none; }
        .btn-stop:hover { background: color-mix(in srgb, var(--color-terminate) 85%, white); box-shadow: 0 6px 20px var(--color-terminate-glow); transform: translateY(-1px); }

        #errorText { 
            color: var(--color-terminate); font-size: 14px; font-weight: 500; 
            text-align: center; margin-top: var(--space-3); display: none; padding: var(--space-3); 
            background: var(--color-terminate-glow); border-radius: var(--radius-inner); 
            border: 1px solid var(--color-terminate);
        }
        
        /* Stats Box */
        .stats-grid { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4); }
        .stat-box { background: var(--bg-elevated); padding: var(--space-3) var(--space-4); border-radius: var(--radius-inner); display: flex; justify-content: space-between; align-items: center; }
        .stat-label { color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .stat-value { color: var(--text-main); font-size: 14px; font-weight: 600; font-family: var(--font-body); }
        
        #dashboardView { display: none; }
        @keyframes skeleton-pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .skeleton { background: var(--border-subtle); border-radius: var(--radius-inner); animation: skeleton-pulse 1.5s infinite ease-in-out; }
        .skeleton-input { height: 48px; width: 100%; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <i data-lucide="steering-wheel"></i>
            <h1>Driver Console</h1>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
            <i id="themeIcon" data-lucide="moon"></i>
        </button>
    </header>

    <div class="container">
        <!-- Step 1 & 2: Auth / Setup -->
        <div class="card" id="loginView">
            <div class="card-body">
                <div class="step-indicator">
                    <div class="step active" id="step1"><div class="step-dot">1</div> Enter PIN</div>
                    <div class="step-line" id="line1"></div>
                    <div class="step" id="step2"><div class="step-dot">2</div> Routing</div>
                    <div class="step-line" id="line2"></div>
                    <div class="step" id="step3"><div class="step-dot">3</div> Connect</div>
                </div>

                <div class="form-group">
                    <label>Operator PIN</label>
                    <input type="password" id="driverPin" placeholder="Enter secure PIN code">
                </div>

                <div id="route-selector-container">
                    <div class="form-group" id="route-skeleton">
                        <label>Assigned Route</label>
                        <div class="skeleton skeleton-input"></div>
                    </div>
                    
                    <div id="route-controls" style="display: none;">
                        <div class="form-group">
                            <label>Assigned Route</label>
                            <div class="custom-select-wrapper">
                                <i data-lucide="route" class="select-icon"></i>
                                <select id="routeSelect"></select>
                                <i data-lucide="chevron-down" class="select-arrow"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Assigned Vehicle</label>
                            <div class="custom-select-wrapper">
                                <i data-lucide="bus" class="select-icon"></i>
                                <select id="busSelect">
                                    <option value="BUS-101">Vehicle BUS-101</option>
                                    <option value="BUS-102">Vehicle BUS-102</option>
                                    <option value="BUS-103">Vehicle BUS-103</option>
                                </select>
                                <i data-lucide="chevron-down" class="select-arrow"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="loginBtn" class="btn btn-primary" disabled><i data-lucide="log-in"></i> Initialize Session</button>
                <div id="errorText">Authentication failed. Please verify your PIN.</div>
            </div>
        </div>

        <!-- Step 3: Dashboard -->
        <div class="card" id="dashboardView">
            <div class="card-header" style="justify-content: center; border-bottom: none; padding-bottom: 0;">
                <h2 id="activeRouteText" class="font-heading" style="font-size: 24px; color: var(--text-main);">Route / Bus</h2>
            </div>

            <div class="card-body">
                <button id="startBtn" class="btn btn-start">
                    <i data-lucide="power"></i> Engage GPS Telemetry
                </button>
                <button id="stopBtn" class="btn btn-stop">
                    <i data-lucide="stop-circle"></i> Terminate Telemetry
                </button>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">System Status</span>
                        <span class="stat-value" id="statusText" style="color: var(--text-muted);">Inactive</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Coordinates</span>
                        <span class="stat-value" id="locText" style="font-family: monospace;">--</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">GPS Variance</span>
                        <span class="stat-value" id="accText">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        lucide.createIcons();

        const themeToggle = document.getElementById('themeToggle');
        
        function updateThemeIcon(theme) {
            themeToggle.innerHTML = theme === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
            lucide.createIcons();
        }
        updateThemeIcon(document.documentElement.getAttribute('data-theme'));

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('smartbus-theme', theme);
            updateThemeIcon(theme);
        });

        const socket = io();
        let watchId = null;
        let gpsInterval = null;
        let lastPosition = null;
        let wakeLock = null; 

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Wake Lock error: ${err.name}, ${err.message}`);
            }
        }

        const loginView = document.getElementById('loginView');
        const driverPin = document.getElementById('driverPin');
        const routeSelect = document.getElementById('routeSelect');
        const busSelect = document.getElementById('busSelect');
        const loginBtn = document.getElementById('loginBtn');
        const errorText = document.getElementById('errorText');

        const dashboardView = document.getElementById('dashboardView');
        const activeRouteText = document.getElementById('activeRouteText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        const locText = document.getElementById('locText');
        const accText = document.getElementById('accText');
        const statusText = document.getElementById('statusText');

        let activeRouteId = '';
        let activeBusId = '';

        socket.on('initData', (routesData) => {
            document.getElementById('route-skeleton').style.display = 'none';
            document.getElementById('route-controls').style.display = 'block';
            loginBtn.disabled = false;
            
            // Advance wizard to Step 2
            document.getElementById('step1').classList.add('completed');
            document.getElementById('line1').classList.add('completed');
            document.getElementById('step2').classList.add('active');

            routeSelect.innerHTML = '';
            routesData.forEach(route => {
                const opt = document.createElement('option');
                opt.value = route.id;
                opt.textContent = `Route ${route.id}: ${route.name}`;
                routeSelect.appendChild(opt);
            });
        });

        loginBtn.addEventListener('click', () => {
            const pin = driverPin.value.trim();
            if (!pin) return;
            
            activeRouteId = routeSelect.value;
            activeBusId = busSelect.value;
            
            loginBtn.innerHTML = '<i data-lucide="loader" class="animate-spin"></i> Verifying...';
            lucide.createIcons();
            socket.emit('authenticateDriver', { routeId: activeRouteId, busId: activeBusId, driverPin: pin });
        });

        socket.on('authSuccess', () => {
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            activeRouteText.textContent = `${activeBusId} • Route ${activeRouteId}`;
        });

        socket.on('authFailed', (data) => {
            loginBtn.innerHTML = '<i data-lucide="log-in"></i> Initialize Session';
            lucide.createIcons();
            errorText.textContent = data.message || 'Authentication failed.';
            errorText.style.display = 'block';
        });

        function sendLocation() {
            if (!lastPosition) return;
            const { latitude, longitude, speed, heading, accuracy } = lastPosition.coords;

            socket.emit('driverLocationUpdate', {
                routeId: activeRouteId, busId: activeBusId,
                lat: latitude, lng: longitude, speed: speed, heading: heading, accuracy: accuracy
            });

            statusText.textContent = 'Active Telemetry';
            statusText.style.color = 'var(--color-live)';
            
            locText.textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
            accText.textContent = `±${Math.round(accuracy)}m`;
        }

        startBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Hardware telemetry not supported.');
                return;
            }

            startBtn.style.display = 'none';
            stopBtn.style.display = 'flex';
            
            statusText.textContent = 'Synchronizing...';
            statusText.style.color = 'var(--color-warning)';

            requestWakeLock(); 

            navigator.geolocation.getCurrentPosition(
                (pos) => { lastPosition = pos; sendLocation(); },
                (error) => { console.error(error); },
                { enableHighAccuracy: true, timeout: 10000 }
            );

            watchId = navigator.geolocation.watchPosition(
                (position) => { 
                    lastPosition = position; 
                    sendLocation(); 
                },
                (error) => {
                    console.error(error);
                    statusText.textContent = `Error: ${error.message}`;
                    statusText.style.color = 'var(--color-terminate)';
                },
                { enableHighAccuracy: true, timeout: 15000 }
            );

            gpsInterval = setInterval(sendLocation, 3000);
        });

        function stopDuty() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (gpsInterval !== null) { clearInterval(gpsInterval); gpsInterval = null; }
            if (wakeLock !== null) { wakeLock.release().then(() => wakeLock = null); }
            lastPosition = null;
            
            socket.emit('driverStopDuty');
            
            startBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            
            statusText.textContent = 'Inactive';
            statusText.style.color = 'var(--text-muted)';
            
            locText.textContent = '--';
            accText.textContent = '--';
        }

        stopBtn.addEventListener('click', stopDuty);

        window.addEventListener('beforeunload', () => {
            if (watchId !== null || gpsInterval !== null) socket.emit('driverStopDuty');
        });
    </script>
</body>
</html>
