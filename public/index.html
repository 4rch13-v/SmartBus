<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBus Transit Tracking</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        const sysPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('smartbus-theme') || (sysPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        :root {
            --font-heading: 'Sora', sans-serif;
            --font-body: 'Inter', sans-serif;
            
            --color-primary: #5b4de0; /* Darker violet for light mode */
            --color-primary-glow: rgba(91, 77, 224, 0.35);
            --color-live: #16a34a; /* Darker green */
            --color-live-glow: rgba(22, 163, 74, 0.35);
            --color-terminate: #e11d48;
            --color-terminate-glow: rgba(225, 29, 72, 0.35);
            --color-warning: #D97706;
            
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-elevated: #F1F5F9;
            
            --border-subtle: #E2E8F0;
            --border-card: #CBD5E1;
            --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
            
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-inv: #FFFFFF;
            
            --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 32px;
            --radius-outer: 16px; --radius-inner: 12px; --radius-btn: 14px;
            --transition: all 0.2s ease-in-out;
            --header-height: 72px;
        }

        [data-theme="dark"] {
            --color-primary: #6D5EF5;
            --color-primary-glow: rgba(109, 94, 245, 0.35);
            --color-live: #22C55E;
            --color-live-glow: rgba(34, 197, 94, 0.35);
            --color-terminate: #F43F5E;
            --color-terminate-glow: rgba(244, 63, 94, 0.35);
            --color-warning: #F59E0B;
            
            --bg-page: #0B0D14;
            --bg-card: #12151F;
            --bg-elevated: #181C29;
            
            --border-subtle: rgba(255,255,255,0.06);
            --border-card: rgba(255,255,255,0.06);
            --shadow-card: 0 4px 20px rgba(0,0,0,0.35);
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        
        * { box-sizing: border-box; }
        *:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
        
        body { 
            font-family: var(--font-body); 
            background: var(--bg-page); color: var(--text-main); 
            margin: 0; padding: 0; 
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            line-height: 1.5;
        }

        h1, h2, h3, h4, .font-heading { font-family: var(--font-heading); margin: 0; }
        
        /* Sticky Header */
        .navbar {
            height: var(--header-height); background: var(--bg-card);
            border-bottom: 1px solid var(--border-card);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 var(--space-4); z-index: 2000; box-shadow: var(--shadow-card); flex-shrink: 0;
        }
        
        .brand { display: flex; align-items: center; gap: var(--space-2); }
        .brand i { color: var(--color-primary); width: 28px; height: 28px; }
        .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        
        .icon-btn {
            background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text-muted);
            cursor: pointer; padding: var(--space-2); border-radius: var(--radius-inner);
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .icon-btn:hover { background: var(--bg-card); color: var(--text-main); border-color: var(--text-muted); }
        .icon-btn:active { transform: scale(0.92); }

        /* Main Layout */
        .main-content { flex-grow: 1; position: relative; display: flex; }
        #map { width: 100%; height: 100%; z-index: 1; background: var(--bg-page); }
        [data-theme="dark"] .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(1.2) hue-rotate(180deg); }
        
        /* Map Controls Overrides */
        .leaflet-bar { border: 1px solid var(--border-subtle) !important; border-radius: var(--radius-inner) !important; box-shadow: 0 4px 16px rgba(0,0,0,0.15) !important; overflow: hidden; }
        .leaflet-bar a { background-color: var(--bg-card) !important; color: var(--text-main) !important; border-bottom: 1px solid var(--border-subtle) !important; width: 32px !important; height: 32px !important; line-height: 32px !important; }
        .leaflet-bar a:last-child { border-bottom: none !important; }
        .leaflet-bar a:hover { background-color: var(--bg-elevated) !important; }

        /* Floating Side Panel */
        .floating-panel {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: var(--bg-card); z-index: 1000;
            border-radius: var(--radius-outer) var(--radius-outer) 0 0;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; max-height: 85dvh; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            border-top: 1px solid var(--border-card);
        }
        .floating-panel.collapsed { transform: translateY(100%); opacity: 0; pointer-events: none; }

        @media (min-width: 768px) {
            .floating-panel {
                top: var(--space-4); bottom: var(--space-4); left: var(--space-4); right: auto;
                width: 400px; border-radius: var(--radius-outer); max-height: none;
                box-shadow: var(--shadow-card); border: 1px solid var(--border-card);
            }
            .floating-panel.collapsed { transform: translateX(-120%); }
        }
        
        .panel-toggle-fab {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--color-primary); color: #fff; border: none; padding: 14px 28px;
            border-radius: 30px; font-family: var(--font-body); font-weight: 600; font-size: 15px;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 16px var(--color-primary-glow);
            cursor: pointer; z-index: 2000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1; pointer-events: auto; white-space: nowrap;
        }
        .panel-toggle-fab:active { transform: translateX(-50%) scale(0.95); }
        .panel-toggle-fab.hidden { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }
        
        @media (min-width: 768px) {
            .panel-toggle-fab { left: 24px; bottom: 24px; transform: none; }
            .panel-toggle-fab:active { transform: scale(0.95); }
            .panel-toggle-fab.hidden { transform: translateY(120px); }
        }

        .panel-header { padding: var(--space-4) var(--space-4) var(--space-3); }
        .panel-header h2 { font-size: 20px; font-weight: 600; margin-bottom: var(--space-1); }
        .panel-header p { font-size: 14px; color: var(--text-muted); margin: 0; }

        .panel-controls { padding: 0 var(--space-4) var(--space-3); border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: var(--space-3); }
        
        /* Custom Select */
        .custom-select-wrapper { position: relative; width: 100%; }
        .custom-select-wrapper i.select-icon { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 20px; height: 20px; pointer-events: none; }
        .custom-select-wrapper i.select-arrow { position: absolute; right: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 20px; height: 20px; pointer-events: none; }
        select { 
            width: 100%; padding: var(--space-3) 44px; border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-inner); font-size: 15px; font-weight: 500; font-family: var(--font-body);
            background: var(--bg-elevated); color: var(--text-main); appearance: none; cursor: pointer; transition: var(--transition);
        }
        select:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-glow); }

        /* Segmented Toggle */
        .status-segment { display: flex; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-btn); padding: var(--space-1); gap: var(--space-1); }
        .segment-item { flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: var(--space-2) var(--space-3); border-radius: var(--radius-inner); color: var(--text-muted); transition: var(--transition); border: 1px solid transparent; display: flex; align-items: center; justify-content: center; gap: var(--space-2); }
        .segment-item.active-live { background: var(--color-live); color: #fff; box-shadow: 0 4px 12px var(--color-live-glow); border-color: var(--color-live); }
        .segment-item.active-sim { background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow-card); border-color: var(--border-card); }
        .segment-item i { width: 14px; height: 14px; }

        .panel-content { 
            flex-grow: 1; overflow-y: auto; overflow-x: hidden; 
            padding: var(--space-4); padding-bottom: calc(var(--space-4) + 40px);
            -webkit-overflow-scrolling: touch; 
        }
        
        /* ETA Cards */
        .stop-item { padding: var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-inner); margin-bottom: var(--space-3); background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
        .stop-item.passed { opacity: 0.5; background: var(--bg-page); }
        .stop-item.next-stop { border-color: var(--color-primary); background: var(--color-primary-glow); }
        .stop-name { font-weight: 600; font-size: 15px; color: var(--text-main); }
        .eta-badge { background: var(--color-primary); color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 8px var(--color-primary-glow); display: flex; align-items: center; gap: 4px; }
        .eta-badge.passed-badge { background: var(--bg-elevated); color: var(--text-muted); box-shadow: none; border: 1px solid var(--border-subtle); padding: 4px 8px; }

        @keyframes skeleton-pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .skeleton { background: var(--border-subtle); border-radius: var(--radius-inner); animation: skeleton-pulse 1.5s infinite ease-in-out; }
        .skeleton-input { height: 50px; width: 100%; }
        .skeleton-box { height: 60px; margin-bottom: var(--space-3); width: 100%; border-radius: var(--radius-inner); }

        /* Map Popups */
        .leaflet-popup-content-wrapper { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-card); border-radius: var(--radius-inner); font-family: var(--font-body); font-size: 14px; font-weight: 600; box-shadow: var(--shadow-card); }
        .leaflet-popup-tip { background: var(--bg-card); border-color: var(--border-card); }
        
        /* Custom Marker */
        .marker-bus { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card); border: 2px solid var(--bg-card); background: var(--color-primary); position: relative; z-index: 2; }
        .live-pulse-ring { position: absolute; left: -8px; top: -8px; right: -8px; bottom: -8px; border-radius: 50%; border: 2px solid var(--color-primary); animation: map-pulse 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; z-index: 1; }
        @keyframes map-pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <i data-lucide="bus-front"></i>
            <h1>SmartBus</h1>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
            <i id="themeIcon" data-lucide="moon"></i>
        </button>
    </header>

    <div class="main-content">
        <div id="map"></div>
        
        <button id="openPanelBtn" class="panel-toggle-fab hidden">
            <i data-lucide="list"></i> <span>Show Routes</span>
        </button>

        <div id="side-panel" class="floating-panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h2 class="font-heading">Track your bus</h2>
                    <p>Select a route to view real-time arrivals</p>
                </div>
                <button id="closePanelBtn" class="icon-btn" style="margin-top: -4px; margin-right: -4px;" aria-label="Close Panel"><i data-lucide="x"></i></button>
            </div>
            
            <div class="panel-controls">
                <div id="route-selector-container">
                    <div class="skeleton skeleton-input" id="route-selector-skeleton"></div>
                    <div class="custom-select-wrapper" id="route-controls" style="display: none;">
                        <i data-lucide="route" class="select-icon"></i>
                        <select id="route-selector">
                            <option value="" disabled selected>Select Active Route</option>
                        </select>
                        <i data-lucide="chevron-down" class="select-arrow"></i>
                    </div>
                </div>

                <div class="status-segment" id="telemetry-segment">
                    <div class="segment-item active-sim" id="seg-sim"><i data-lucide="radio"></i> SIMULATED</div>
                    <div class="segment-item" id="seg-live"><i data-lucide="satellite"></i> LIVE GPS</div>
                </div>
            </div>
            
            <div class="panel-content" id="eta-list">
                <div class="skeleton skeleton-box"></div>
                <div class="skeleton skeleton-box"></div>
                <div class="skeleton skeleton-box"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <script>
        lucide.createIcons();

        // Panel Toggle Logic
        const panel = document.getElementById('side-panel');
        const closePanelBtn = document.getElementById('closePanelBtn');
        const openPanelBtn = document.getElementById('openPanelBtn');

        closePanelBtn.addEventListener('click', () => {
            panel.classList.add('collapsed');
            openPanelBtn.classList.remove('hidden');
        });
        openPanelBtn.addEventListener('click', () => {
            panel.classList.remove('collapsed');
            openPanelBtn.classList.add('hidden');
        });

        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        
        function updateThemeIcon(theme) {
            themeToggle.innerHTML = theme === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
            lucide.createIcons();
        }
        updateThemeIcon(document.documentElement.getAttribute('data-theme'));

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('smartbus-theme', theme);
            updateThemeIcon(theme);
        });

        // Map setup
        const map = L.map('map', { zoomControl: false }).setView([22.7196, 75.8577], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);
        
        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const socket = io();
        let routesData = [];
        let activeRouteId = null;

        let busMarker;
        let routePolyline;
        const stopMarkers = [];

        function getBusIcon(isLive) {
            const pulseNode = isLive ? '<div class="live-pulse-ring"></div>' : '';
            const busSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>`;
            const iconHtml = `${pulseNode}<div class="marker-bus">${busSvg}</div>`;
            return L.divIcon({ html: iconHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 18] });
        }

        const routeSelector = document.getElementById('route-selector');
        const routeSkeleton = document.getElementById('route-selector-skeleton');
        const routeControls = document.getElementById('route-controls');
        const etaList = document.getElementById('eta-list');
        const segSim = document.getElementById('seg-sim');
        const segLive = document.getElementById('seg-live');

        socket.on('initData', (data) => {
            routesData = data;
            routeSkeleton.style.display = 'none';
            routeControls.style.display = 'block';
            etaList.innerHTML = '<div style="padding:32px; text-align:center; color:var(--text-muted);"><i data-lucide="map" style="width:48px;height:48px;opacity:0.5;margin-bottom:16px;"></i><p>Select a route to view arrivals</p></div>';
            lucide.createIcons();
            
            routeSelector.innerHTML = '<option value="" disabled selected>Select Active Route</option>';
            routesData.forEach(route => {
                const opt = document.createElement('option');
                opt.value = route.id;
                opt.textContent = `Route ${route.id}: ${route.name}`;
                routeSelector.appendChild(opt);
            });
        });

        routeSelector.addEventListener('change', (e) => {
            activeRouteId = e.target.value;
            renderRoute(activeRouteId);
        });

        function renderRoute(routeId) {
            const route = routesData.find(r => r.id === routeId);
            if (!route) return;

            if (routePolyline) map.removeLayer(routePolyline);
            stopMarkers.forEach(m => map.removeLayer(m));
            stopMarkers.length = 0;

            const styleSurface = getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim();
            
            routePolyline = L.polyline(route.routePath.map(p => [p.lat, p.lng]), {color: '#2563EB', weight: 6, opacity: 1}).addTo(map);

            route.stops.forEach((s, index) => {
                const isStartOrEnd = index === 0 || index === route.stops.length - 1;
                const marker = L.circleMarker([s.lat, s.lng], {
                    radius: isStartOrEnd ? 7 : 5, 
                    fillColor: styleSurface, 
                    color: '#2563EB', 
                    weight: 3, opacity: 1, fillOpacity: 1
                }).addTo(map);
                marker.bindPopup(`${s.name}`);
                stopMarkers.push(marker);
            });

            if(busMarker) busMarker.setIcon(getBusIcon(false));
            map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });
            
            etaList.innerHTML = '<div style="padding:32px; text-align:center; color:var(--text-muted);"><i data-lucide="loader" class="animate-spin" style="margin-bottom:16px;"></i><p>Locating transit vehicle...</p></div>';
            
            segSim.className = 'segment-item active-sim';
            segLive.className = 'segment-item';
            lucide.createIcons();
        }

        socket.on('busUpdates', (updates) => {
            if (!activeRouteId) return;
            const update = updates.find(u => u.routeId === activeRouteId);
            if (!update) return;

            if (!busMarker) {
                busMarker = L.marker([update.position.lat, update.position.lng], {icon: getBusIcon(update.isLive), zIndexOffset: 1000}).addTo(map);
            } else {
                busMarker.setLatLng([update.position.lat, update.position.lng]);
                busMarker.setIcon(getBusIcon(update.isLive));
            }

            if (update.isLive) {
                segLive.className = 'segment-item active-live';
                segSim.className = 'segment-item';
            } else {
                segSim.className = 'segment-item active-sim';
                segLive.className = 'segment-item';
            }

            etaList.innerHTML = '';
            let firstNextStopFound = false;

            update.etas.forEach((eta) => {
                const div = document.createElement('div');
                let isPassed = eta.etaMin === -1;
                let isNext = false;
                
                if (!isPassed && !firstNextStopFound) {
                    isNext = true;
                    firstNextStopFound = true;
                }

                div.className = `stop-item ${isPassed ? 'passed' : ''} ${isNext ? 'next-stop' : ''}`;
                
                let rightContent = '';
                if (isPassed) {
                    rightContent = `<div class="eta-badge passed-badge"><i data-lucide="check-circle" style="width:14px;height:14px;margin-bottom:-2px;"></i></div>`;
                } else if (eta.etaMin === 0) {
                    rightContent = `<div class="eta-badge"><i data-lucide="bell" style="width:14px;"></i> Arriving</div>`;
                } else {
                    rightContent = `<div class="eta-badge"><i data-lucide="clock" style="width:14px;"></i> ${eta.etaMin} min</div>`;
                }

                div.innerHTML = `
                    <div class="stop-name">${eta.name}</div>
                    ${rightContent}
                `;
                etaList.appendChild(div);
            });
            lucide.createIcons();
        });
    </script>
</body>
</html>
